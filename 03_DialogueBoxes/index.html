<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialogue Boxes</title>
    <script src="script.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            color: #333;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
        }
        ul {
            list-style-type: square;
        }
    </style>
</head>
<body>
    <h1>Dialogue Boxes</h1>
    <p>There are three types of dialogue boxes in JavaScript:</p>
    <ul>
        <li><strong>alert():</strong> Displays a message and an OK button.</li>
        <li><strong>confirm():</strong> Displays a message with OK and Cancel buttons.</li>
        <li><strong>prompt():</strong> Displays a message with a text input field and OK and Cancel buttons.</li>
    </ul>
    <button id="alertBtn">Show Alert</button>
    <button id="confirmBtn">Show Confirm</button>
    <button id="promptBtn">Show Prompt</button>   
</body>
</html>
