    <h1>How to See Variable Address in devtools</h1>
    <p>In inspect go to memory</p>
    <p>Take a heap snapshot to see the memory addresses of variables.</p>
    <p>In the snapshot, you can find the variables and their corresponding memory addresses.</p>
    <p>In system/context eg: "@432532", you can find the memory address of the variables.</p>
